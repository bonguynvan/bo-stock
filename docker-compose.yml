# One-command stack:  docker compose up --build   →  http://localhost:3000
# Optional keys (ANTHROPIC_API_KEY, FRED_API_KEY, ...) go in backend/.env — see backend/.env.example.
# Ports are bound to 127.0.0.1 on purpose: the app has no login, don't expose it to a network.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vn_investment
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vn_investment"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle — must be reachable FROM THE BROWSER, not the container.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
